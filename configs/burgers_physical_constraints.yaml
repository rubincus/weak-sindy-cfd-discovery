experiment:
  name: burgers_physical_constraints
  output_dir: results/burgers_physical_constraints
  seed_master: 20260612
  save_arrays: true
  save_figures: true

noise:
  cases:
    - type: gaussian_iid
      sigma: 0.05
      seed: 777

identification:
  methods:
    - name: weak_stlsq
      formulation: weak
      regressor: stlsq
      lambda: 0.1
      normalize_columns: true
      max_iter: 12
      test_functions:
        family: compact_cosine
        ax: 0.90
        at: 0.22
        nxc: 14
        ntc: 10
    - name: weak_constrained
      formulation: weak
      regressor: stlsq
      lambda: 0.1
      normalize_columns: true
      max_iter: 12
      constraints:
        positive_diffusion: true
      test_functions:
        family: compact_cosine
        ax: 0.90
        at: 0.22
        nxc: 14
        ntc: 10
    - name: weak_stability_constrained
      formulation: weak
      regressor: stability_selection
      lambda: 0.08
      n_repeats: 40
      row_fraction: 0.70
      probability_threshold: 0.60
      seed: 20260612
      normalize_columns: true
      max_iter: 12
      constraints:
        positive_diffusion: true
      test_functions:
        family: compact_cosine
        ax: 0.90
        at: 0.22
        nxc: 14
        ntc: 10

